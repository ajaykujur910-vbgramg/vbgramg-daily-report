name: VB-G RAM G Direct URL Test

on:
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Open Direct Report URL
        env:
          VBGRAMG_URL: ${{ secrets.VBGRAMG_URL }}
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage();

            console.log("Opening direct VB-G RAM G report...");

            const response = await page.goto(process.env.VBGRAMG_URL, {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });

            console.log("HTTP Status:", response ? response.status() : "No response");
            console.log("Page Title:", await page.title());
            console.log("Final URL:", page.url());

            await page.screenshot({
              path: 'report-test.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node test.js

      - name: Save Report Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: vbgramg-report-test
          path: report-test.png

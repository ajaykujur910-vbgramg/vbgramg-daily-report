name: VB-G RAM G Excel Download Test

on:
  workflow_dispatch:

jobs:
  download-test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Open report and download Excel
        env:
          VBGRAMG_URL: ${{ secrets.VBGRAMG_URL }}
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({
              acceptDownloads: true
            });

            console.log("Opening report...");

            const response = await page.goto(process.env.VBGRAMG_URL, {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });

            console.log("HTTP Status:", response ? response.status() : "No response");
            console.log("Page URL:", page.url());
            console.log("Page Title:", await page.title());

            const button = page.getByText('Download In Excel', {
              exact: true
            });

            await button.waitFor({
              state: 'visible',
              timeout: 30000
            });

            console.log("Download button found.");

            const downloadPromise = page.waitForEvent('download', {
              timeout: 30000
            });

            await button.click();

            const download = await downloadPromise;

            const filename = download.suggestedFilename();
            console.log("Downloaded file:", filename);

            await download.saveAs(filename);

            console.log("File size:", fs.statSync(filename).size);

            await page.screenshot({
              path: 'report-after-download.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node test.js

      - name: Upload Excel file
        uses: actions/upload-artifact@v4
        with:
          name: vbgramg-excel-test
          path: "*.xls"
          if-no-files-found: error

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: vbgramg-screenshot
          path: report-after-download.png

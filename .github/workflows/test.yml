name: VB-G RAM G Navigation Test

on:
  workflow_dispatch:

jobs:
  navigation-test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Open Home and go to MIS Report
        run: |
          cat > test.js <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: { width: 1366, height: 900 }
            });

            console.log("1. Opening VB-G RAM G home page...");

            const homeResponse = await page.goto(
              'https://vbgramgrep.dord.gov.in/vbgramg/homeblue-theme/home_gramg.aspx',
              {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              }
            );

            console.log(
              "Home HTTP:",
              homeResponse ? homeResponse.status() : "No response"
            );

            console.log("Home title:", await page.title());
            console.log("Home URL:", page.url());

            await page.screenshot({
              path: '01-home.png',
              fullPage: true
            });

            console.log("2. Hovering Analytics & Reports...");

            const analytics = page.getByText(
              'Analytics & Reports',
              { exact: true }
            );

            await analytics.hover();

            await page.waitForTimeout(1500);

            console.log("3. Looking for MIS Report...");

            const misReport = page.getByText(
              'MIS Report',
              { exact: true }
            );

            await misReport.waitFor({
              state: 'visible',
              timeout: 15000
            });

            console.log("MIS Report menu found.");

            await misReport.click();

            await page.waitForLoadState('domcontentloaded').catch(() => {});

            await page.waitForTimeout(3000);

            console.log("Final URL:", page.url());
            console.log("Final title:", await page.title());

            const bodyText = await page.locator('body').innerText();

            console.log(
              "CAPTCHA found:",
              /captcha code|what will be/i.test(bodyText)
            );

            await page.screenshot({
              path: '02-mis-report.png',
              fullPage: true
            });

            await browser.close();
          })();
          EOF

          node test.js

      - name: Save screenshots
        uses: actions/upload-artifact@v4
        with:
          name: vbgramg-navigation-test
          path: "*.png"
